<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MalikTool — All in One Tools</title>
<style>
:root{--bg:#08111f;--panel:#101d30;--panel2:#14243a;--text:#edf4ff;--muted:#9fb1ca;--accent:#55d6ff;--accent2:#8a7dff;--line:#22344d;--good:#58dfb1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#142b4c 0,transparent 40%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{max-width:1150px;margin:auto;padding:28px 22px 16px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800;letter-spacing:.3px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#06101d;font-weight:900;font-size:22px;box-shadow:0 8px 25px #55d6ff2c}.brand span{color:var(--accent)}.search{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--text);width:min(310px);outline:none}.hero{max-width:1150px;margin:10px auto 25px;padding:15px 22px}.hero h1{font-size:clamp(30px,5vw,46px);margin:5px 0 10px;line-height:1.1}.hero h1 em{font-style:normal;color:var(--accent)}.hero p{color:var(--muted);margin:0;max-width:650px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:19px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 13px;cursor:pointer}.chip.active,.chip:hover{background:#15314b;border-color:var(--accent);color:var(--accent)}main{max-width:1150px;margin:auto;padding:0 22px 50px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:25px 0 14px}.section-head h2{font-size:19px;margin:0}.section-head small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.tool-card{background:linear-gradient(145deg,var(--panel),#0d192b);border:1px solid var(--line);border-radius:18px;padding:17px;min-height:160px;transition:.18s;cursor:pointer}.tool-card:hover{transform:translateY(-3px);border-color:#3b7393;box-shadow:0 12px 30px #0002}.tool-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#18334b;color:var(--accent);font-size:21px;margin-bottom:12px}.tool-card h3{margin:0 0 6px;font-size:16px}.tool-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.tool-card .tag{display:inline-block;margin-top:12px;font-size:11px;color:#84cfe9;background:#163146;border-radius:6px;padding:4px 7px}.modal{display:none;position:fixed;inset:0;background:#020710c9;z-index:5;padding:18px;align-items:center;justify-content:center}.modal.show{display:flex}.dialog{width:min(560px,100%);max-height:90vh;overflow:auto;background:#101d30;border:1px solid #2b4564;border-radius:20px;padding:20px;box-shadow:0 25px 80px #0007}.dialog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.dialog-top h2{margin:0;font-size:20px}.close{background:#1d3049;color:#cfe4ff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}.field{margin:11px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.input,textarea,select{width:100%;background:#091526;border:1px solid #263c58;border-radius:11px;padding:11px;color:var(--text);font:inherit;outline:none}.input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 14px;background:linear-gradient(135deg,var(--accent),#9af0ff);color:#04111d;font-weight:700;cursor:pointer;margin:5px 4px 5px 0}.btn.secondary{background:#20344d;color:var(--text)}.result{margin-top:12px;background:#091728;border:1px solid #20344a;border-radius:12px;padding:12px;min-height:40px;white-space:pre-wrap;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:12px;color:var(--muted)}.timer{font-size:46px;text-align:center;font-weight:800;letter-spacing:2px;padding:22px;color:var(--accent)}.empty{grid-column:1/-1;color:var(--muted);padding:25px;text-align:center;border:1px dashed var(--line);border-radius:15px}footer{text-align:center;color:#7f94ae;border-top:1px solid var(--line);padding:22px;font-size:13px}@media(max-width:620px){header{align-items:flex-start;flex-direction:column}.search{width:100%}.hero{padding-top:10px}.split{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:10px}.tool-card{padding:13px;min-height:150px}.tool-card p{font-size:12px}.brand{font-size:20px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">T</div>ToolBox<span>X</span></div><input id="search" class="search" placeholder="Search tools…" aria-label="Search tools"></header>
<section class="hero"><h1>Everyday tools,<br><em>one simple place.</em></h1><p>Handy mini-tools for calculations, text, conversions and everyday tasks. Quick, simple, and right in your browser.</p><div class="chips" id="filters"><button class="chip active" data-cat="All">All tools</button><button class="chip" data-cat="Math">Math</button><button class="chip" data-cat="Text">Text</button><button class="chip" data-cat="Convert">Convert</button><button class="chip" data-cat="Utility">Utility</button></div></section>
<main><div class="section-head"><h2>Explore tools</h2><small id="count">8 tools</small></div><div class="grid" id="toolGrid"></div></main><footer>MalikTool · Useful tools, thoughtfully simple.</footer>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-top"><h2 id="modalTitle">Tool</h2><button class="close" id="close">✕</button></div><div id="toolBody"></div></div></div>
<script>
const tools=[
{id:'calc',name:'Quick Calculator',icon:'＋',cat:'Math',desc:'Do basic arithmetic with a simple calculator.',tag:'Everyday math'},
{id:'percent',name:'Percentage Calculator',icon:'％',cat:'Math',desc:'Calculate a percentage, discount, or percentage change.',tag:'Percent & discount'},
{id:'words',name:'Word & Text Counter',icon:'Aa',cat:'Text',desc:'Count words, characters, and lines in your text.',tag:'Writing helper'},
{id:'case',name:'Text Case Converter',icon:'⇅',cat:'Text',desc:'Convert text to uppercase, lowercase, title case, or sentence case.',tag:'Text formatting'},
{id:'units',name:'Unit Converter',icon:'↔',cat:'Convert',desc:'Convert length, weight, and temperature units.',tag:'Conversions'},
{id:'color',name:'Color Picker',icon:'◉',cat:'Utility',desc:'Pick a color and copy its HEX or RGB value.',tag:'Design helper'},
{id:'timer',name:'Stopwatch',icon:'◷',cat:'Utility',desc:'Start, pause, reset and time an activity.',tag:'Time tool'},
{id:'notes',name:'Quick Notes',icon:'✎',cat:'Utility',desc:'Write a note and copy it when you need it. Notes stay in this tab while open.',tag:'Scratchpad'}
];
const grid=document.getElementById('toolGrid'), search=document.getElementById('search');let category='All';
function render(){let list=tools.filter(t=>(category==='All'||t.cat===category)&&(`${t.name} ${t.desc} ${t.cat}`.toLowerCase().includes(search.value.toLowerCase())));document.getElementById('count').textContent=list.length+' tools';grid.innerHTML=list.map(t=>`<article class="tool-card" data-id="${t.id}"><div class="tool-icon">${t.icon}</div><h3>${t.name}</h3><p>${t.desc}</p><span class="tag">${t.tag}</span></article>`).join('')||'<div class="empty">No tools match your search.</div>';grid.querySelectorAll('.tool-card').forEach(card=>card.onclick=()=>openTool(card.dataset.id));}
search.addEventListener('input',render);document.getElementById('filters').addEventListener('click',e=>{if(!e.target.matches('.chip'))return;category=e.target.dataset.cat;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===e.target));render()});
const modal=document.getElementById('modal'),body=document.getElementById('toolBody');function openTool(id){let t=tools.find(x=>x.id===id);document.getElementById('modalTitle').textContent=t.name;modal.classList.add('show');body.innerHTML=toolHTML(id);bindTool(id)}function closeModal(){modal.classList.remove('show')}document.getElementById('close').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function toolHTML(id){switch(id){case'calc':return `<input class="input" id="calcInput" placeholder="Example: (12 + 5) × 3"/><button class="btn" id="calcGo">Calculate</button><div class="result" id="calcResult">Your result will appear here.</div><p class="hint">Use +, −, ×, ÷ and parentheses.</p>`;
case'percent':return `<div class="field"><label>What is this percentage of a number?</label><div class="split"><input class="input" id="pct" type="number" placeholder="Percent"><input class="input" id="num" type="number" placeholder="Number"></div><button class="btn" id="pctGo">Calculate</button><div class="result" id="pctResult"></div></div><div class="field"><label>Discount price</label><div class="split"><input class="input" id="price" type="number" placeholder="Original price"><input class="input" id="discount" type="number" placeholder="Discount %"></div><button class="btn secondary" id="discGo">Calculate discount</button><div class="result" id="discResult"></div></div>`;
case'words':return `<textarea id="wordText" placeholder="Paste or type your text here…"></textarea><div class="result" id="wordResult">Words: 0 · Characters: 0 · Lines: 0</div>`;
case'case':return `<textarea id="caseText" placeholder="Enter your text…"></textarea><button class="btn" id="upper">UPPERCASE</button><button class="btn secondary" id="lower">lowercase</button><button class="btn secondary" id="title">Title Case</button><button class="btn secondary" id="sentence">Sentence case</button><button class="btn secondary" id="copyCase">Copy</button><div class="hint" id="caseHint"></div>`;
case'units':return `<div class="field"><label>Conversion type</label><select id="unitType" class="input"><option value="length">Length</option><option value="weight">Weight</option><option value="temp">Temperature</option></select></div><div class="split"><div class="field"><label>From</label><select id="fromUnit" class="input"></select></div><div class="field"><label>To</label><select id="toUnit" class="input"></select></div></div><div class="field"><label>Value</label><input class="input" id="unitVal" type="number" value="1"></div><button class="btn" id="unitGo">Convert</button><div class="result" id="unitResult"></div>`;
case'color':return `<div class="field"><label>Select color</label><input type="color" id="colorPick" value="#55d6ff" style="width:100%;height:70px;border:0;background:transparent"></div><div class="result" id="colorResult">HEX: #55D6FF</div><button class="btn" id="copyColor">Copy HEX</button>`;
case'timer':return `<div class="timer" id="watch">00:00.0</div><div style="text-align:center"><button class="btn" id="startWatch">Start</button><button class="btn secondary" id="pauseWatch">Pause</button><button class="btn secondary" id="resetWatch">Reset</button></div>`;
case'notes':return `<textarea id="notesText" placeholder="Write a quick note…"></textarea><button class="btn" id="copyNotes">Copy note</button><button class="btn secondary" id="clearNotes">Clear</button><div class="hint" id="noteHint"></div>`}}
function bindTool(id){if(id==='calc'){let inp=document.getElementById('calcInput');const run=()=>{try{let s=inp.value.trim().replace(/×/g,'*').replace(/÷/g,'/');if(!s||!/^[0-9+\-*/().%\s]+$/.test(s))throw Error();let result=Function('"use strict";return ('+s+')')();if(!Number.isFinite(result))throw Error();document.getElementById('calcResult').textContent='Result: '+result}catch{document.getElementById('calcResult').textContent='Please enter a valid arithmetic expression.'}};document.getElementById('calcGo').onclick=run;inp.addEventListener('keydown',e=>{if(e.key==='Enter')run()})}
if(id==='percent'){document.getElementById('pctGo').onclick=()=>{let p=Number(document.getElementById('pct').value),n=Number(document.getElementById('num').value);document.getElementById('pctResult').textContent=(p/100*n).toLocaleString()};document.getElementById('discGo').onclick=()=>{let p=Number(document.getElementById('price').value),d=Number(document.getElementById('discount').value);if(d<0||d>100){document.getElementById('discResult').textContent='Discount must be from 0 to 100%.';return}document.getElementById('discResult').textContent=`Discount: ${p*d/100} · Final price: ${p*(1-d/100)}`}}
if(id==='words'){let ta=document.getElementById('wordText');ta.oninput=()=>{let s=ta.value,words=s.trim()?s.trim().split(/\s+/).length:0;document.getElementById('wordResult').textContent=`Words: ${words} · Characters: ${s.length} · Lines: ${s? s.split(/\n/).length:0}`}}
if(id==='case'){let ta=document.getElementById('caseText');const set=s=>{ta.value=s;document.getElementById('caseHint').textContent='Converted. You can copy the result.'};document.getElementById('upper').onclick=()=>set(ta.value.toUpperCase());document.getElementById('lower').onclick=()=>set(ta.value.toLowerCase());document.getElementById('title').onclick=()=>set(ta.value.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()));document.getElementById('sentence').onclick=()=>set(ta.value.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase()));document.getElementById('copyCase').onclick=()=>copyText(ta.value)}
if(id==='units'){let data={length:{'Meters':1,'Kilometers':1000,'Centimeters':.01,'Millimeters':.001,'Miles':1609.344,'Feet':.3048,'Inches':.0254},weight:{'Kilograms':1,'Grams':.001,'Pounds':.45359237,'Ounces':.028349523125},temp:{'Celsius':0,'Fahrenheit':1,'Kelvin':2}};let type=document.getElementById('unitType');function fill(){let units=Object.keys(data[type.value]);['fromUnit','toUnit'].forEach(sel=>{let el=document.getElementById(sel);el.innerHTML=units.map(u=>`<option>${u}</option>`).join('')});document.getElementById('toUnit').selectedIndex=units.length>1?1:0}type.onchange=fill;fill();document.getElementById('unitGo').onclick=()=>{let v=Number(document.getElementById('unitVal').value),a=document.getElementById('fromUnit').value,b=document.getElementById('toUnit').value,typ=type.value,res;if(typ==='temp'){let c=a==='Celsius'?v:a==='Fahrenheit'?(v-32)*5/9:v-273.15;res=b==='Celsius'?c:b==='Fahrenheit'?c*9/5+32:c+273.15}else res=v*data[typ][a]/data[typ][b];document.getElementById('unitResult').textContent=`${v} ${a} = ${Number(res.toFixed(8))} ${b}`}}
if(id==='color'){let p=document.getElementById('colorPick');function update(){let hex=p.value.toUpperCase(),n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;document.getElementById('colorResult').textContent=`HEX: ${hex}\nRGB: ${r}, ${g}, ${b}`};p.oninput=update;update();document.getElementById('copyColor').onclick=()=>copyText(p.value.toUpperCase())}
if(id==='timer'){let start=null,elapsed=0,interval=null;function draw(){let t=elapsed+(start?performance.now()-start:0),m=Math.floor(t/60000),s=Math.floor(t/1000)%60,d=Math.floor(t/100)%10;document.getElementById('watch').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`}document.getElementById('startWatch').onclick=()=>{if(!start){start=performance.now();interval=setInterval(draw,100)}};document.getElementById('pauseWatch').onclick=()=>{if(start){elapsed+=performance.now()-start;start=null;clearInterval(interval);draw()}};document.getElementById('resetWatch').onclick=()=>{start=null;elapsed=0;clearInterval(interval);draw()}}
if(id==='notes'){let ta=document.getElementById('notesText');document.getElementById('copyNotes').onclick=()=>copyText(ta.value);document.getElementById('clearNotes').onclick=()=>{ta.value='';document.getElementById('noteHint').textContent='Cleared.'}}
}
function copyText(s){if(!s){return}if(navigator.clipboard){navigator.clipboard.writeText(s).then(()=>alert('Copied!')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}function fallbackCopy(s){let ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('Copied!')}catch{alert('Copy failed')}ta.remove()}
render();
</script></body></html>
